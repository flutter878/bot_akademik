<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chatbot Akademik</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <h1 style="margin-bottom: 5px;">Chatbot Layanan Akademik</h1>
            <a href="/admin/login" style="font-size: 13px; color: #245db4; text-decoration: none; font-weight: bold;">Portal Admin &rarr;</a>
        </div>
        <p style="margin-top: 0; color: #555; font-size: 14px;">Layanan tanya jawab informasi akademik mahasiswa (Tahap 2: Database & Backend Aktif)</p>
        
        <section id="chat" aria-live="polite">
            <p class="bot">Halo! Silakan ajukan pertanyaan seputar jadwal kuliah, KRS, UKT, atau administrasi kampus.</p>
        </section>
        
        <form id="form">
            <input id="question" placeholder="Tulis pertanyaan..." required autocomplete="off">
            <button type="submit">Kirim</button>
        </form>
    </main>

    <script>
        const form = document.getElementById('form');
        const chat = document.getElementById('chat');
        const input = document.getElementById('question');

        function add(t, c) {
            const p = document.createElement('p');
            p.className = c;
            p.textContent = t;
            chat.appendChild(p);
            chat.scrollTop = chat.scrollHeight;
        }

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;
            add(q, 'user');
            input.value = '';

            try {
                const r = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: q })
                });
                const d = await r.json();
                if (d.success) {
                    add(d.answer, 'bot');
                } else {
                    add(d.error || 'Terjadi kesalahan.', 'bot');
                }
            } catch {
                add('Gagal menghubungi server.', 'bot');
            }
        });
    </script>
</body>
</html>
